<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C# – Estruturas Fundamentais</title>
<style>
:root{--bg:#f6f4ff;--card:#fff;--tx:#1d1b2e;--mu:#6b6885;--ac:#6c3df0;--ac2:#14b8a6;--code:#1e1b2e;--bd:#ddd8f5;--hit:rgba(165,139,255,.3);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14121f;--card:#1f1c30;--tx:#efedff;--mu:#a29fc0;--ac:#9b7bff;--ac2:#2dd4bf;--code:#0d0b17;--bd:#38335a}}
:root[data-theme="dark"]{--bg:#14121f;--card:#1f1c30;--tx:#efedff;--mu:#a29fc0;--ac:#9b7bff;--ac2:#2dd4bf;--code:#0d0b17;--bd:#38335a}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
button{font:inherit;cursor:pointer}
header{text-align:center;padding:40px 16px 8px}
h1{margin:0;font-size:clamp(1.8rem,5vw,2.8rem)}
h1 span{color:var(--ac)}
header p{color:var(--mu);margin:8px 0 0}
#tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:16px}
#tabs button{border:2px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 20px;border-radius:999px;font-size:1rem;font-weight:600}
#tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
main{max-width:820px;margin:0 auto;padding:0 16px 48px}
#card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px}
h2{margin:0 0 4px}
.note{color:var(--mu);margin:0 0 14px}
#sub{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--bd);margin-bottom:18px}
#sub button{border:2px solid var(--bd);background:var(--bg);color:var(--tx);padding:6px 14px;border-radius:10px;font-family:ui-monospace,Consolas,monospace;font-size:.9rem}
#sub button.on{border-color:var(--ac);color:var(--ac);font-weight:700}
h3{margin:0 0 12px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.info div{background:var(--bg);border-left:4px solid var(--ac);border-radius:10px;padding:12px 14px}
.info div:nth-child(even){border-left-color:var(--ac2)}
.info b{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin-bottom:2px}
.ctl{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin:18px 0 6px}
.ctl label{display:flex;flex-direction:column;font-size:.8rem;color:var(--mu);gap:4px}
input,select{font:inherit;padding:9px 12px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);min-width:90px}
input:focus,select:focus{outline:none;border-color:var(--ac)}
.run{background:var(--ac2);color:#062b27;border:0;border-radius:10px;padding:11px 18px;font-weight:700}
.code{background:var(--code);color:#e8e4ff;padding:12px 0;border-radius:12px;overflow-x:auto;margin:12px 0;font-family:ui-monospace,Consolas,monospace;font-size:.92rem}
.ln{white-space:pre;padding:0 14px;min-height:1.55em;border-left:3px solid transparent}
.ln.hit{background:var(--hit);border-left-color:#a58bff}
.k{color:#c4a8ff}.t{color:#5eead4}.s{color:#fbbf77}
.out{background:var(--bg);border:2px dashed var(--ac);border-radius:12px;padding:12px 14px;min-height:50px;font-family:ui-monospace,Consolas,monospace}
.out .o{white-space:pre;animation:in .25s both}.out .o:before{content:"> ";color:var(--ac)}
.out .e{color:#d33;white-space:pre-wrap}
@keyframes in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
.boxes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.box{background:var(--ac);color:#fff;border-radius:10px;padding:6px 13px;font-weight:700;animation:pop .3s both}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
#home{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:6px}
.mc{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:16px}
.mc p{color:var(--mu);margin:8px 0 12px;font-size:.92rem}
.mt{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--ac);color:#fff;border-radius:10px;padding:11px 14px;font-weight:700;font-size:1rem;text-align:left}
.mt span{background:rgba(255,255,255,.25);border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem}
.chip{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:4px 12px;margin:0 6px 6px 0;font-family:ui-monospace,Consolas,monospace;font-size:.85rem}
.chip:hover{border-color:var(--ac);color:var(--ac)}
footer{text-align:center;color:var(--mu);font-size:.85rem;padding-bottom:30px}
</style>
</head>
<body>
<header>
  <h1>Estruturas fundamentais em <span>C#</span></h1>
  <p>Variáveis · Decisões · Ciclos — experimenta e vê o código a mudar em tempo real</p>
</header>
<nav id="tabs"></nav>
<main>
  <section id="home"></section>
  <section id="card">
    <h2 id="gt"></h2>
    <p class="note" id="gs"></p>
    <div id="sub"></div>
    <div id="body"></div>
  </section>
</main>
<footer>Os exemplos mostram código C# real; a execução é simulada no navegador.</footer>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
  function hl(s){
    return esc(s).replace(/("[^"\n]*")/g,"\u0001$1\u0002")
      .replace(/\b(if|else|for|while|foreach|in|switch|case|break|default)\b/g,'<span class="k">$1</span>')
      .replace(/\b(string|int|double|bool|char)\b/g,'<span class="t">$1</span>')
      .replace(/\u0001/g,'<span class="s">').replace(/\u0002/g,'</span>');
  }
  function codeHTML(lines,hit){
    return lines.map(function(l,i){return '<div class="ln'+(hit.indexOf(i)>-1?' hit':'')+'">'+(hl(l)||' ')+'</div>'}).join('');
  }
  function num(v,d){var n=parseInt(v,10);return isNaN(n)?d:n}

  function vr(tipo){
    return function(v){
      var nome=(v.nome||"").trim(), val=v.val, lit, out, err="";
      if(!/^[A-Za-z_][A-Za-z0-9_]*$/.test(nome)) err="O nome da variável tem de começar por letra ou _ e não pode ter espaços.";
      if(tipo==="int"){
        if(!/^-?\d+$/.test(val)) err=err||"error CS0029: não é possível converter “"+val+"” em int (só números inteiros).";
        lit=val; out=String(parseInt(val,10));
      }else if(tipo==="double"){
        var d=String(val).replace(",",".");
        if(!/^-?\d+(\.\d+)?$/.test(d)) err=err||"error CS0029: “"+val+"” não é um double (exemplo: 3.5).";
        lit=d; out=String(parseFloat(d));
      }else if(tipo==="bool"){
        lit=val; out=val==="true"?"True":"False";
      }else if(tipo==="char"){
        if(val.length!==1) err=err||"Um char tem exatamente 1 carácter.";
        lit="'"+val+"'"; out=val;
      }else{
        lit='"'+val.replace(/"/g,'\\"')+'"'; out=val;
      }
      return {lines:[tipo+" "+nome+" = "+lit+";","Console.WriteLine("+nome+");"],hit:[],out:[out],err:err};
    };
  }
  function ifelse(v){
    var n=num(v.nota,0), L=["int nota = "+n+";","","if (nota >= 18)",'    Console.WriteLine("Excelente");',"else if (nota >= 14)",'    Console.WriteLine("Bom");',"else if (nota >= 10)",'    Console.WriteLine("Aprovado");',"else",'    Console.WriteLine("Reprovado");'];
    var i=n>=18?3:n>=14?5:n>=10?7:9, m=['Excelente','Bom','Aprovado','Reprovado'][[3,5,7,9].indexOf(i)];
    return {lines:L,hit:[i-1,i],out:[m],err:(n<0||n>20)?"Aviso: a nota devia estar entre 0 e 20.":""};
  }
  function logic(v){
    var id=num(v.idade,0), c=v.carta==="true", ok=id>=18&&c;
    var L=["int idade = "+id+";","bool temCarta = "+v.carta+";","","if (idade >= 18 && temCarta)",'    Console.WriteLine("Pode conduzir");',"else",'    Console.WriteLine("Não pode conduzir");'];
    return {lines:L,hit:ok?[3,4]:[5,6],out:[ok?"Pode conduzir":"Não pode conduzir"],err:""};
  }
  function sw(v){
    var d=num(v.dia,1), fim=d===6||d===7;
    var L=["int dia = "+d+";","","switch (dia)","{","    case 6:","    case 7:",'        Console.WriteLine("Fim de semana");',"        break;","    default:",'        Console.WriteLine("Dia útil");',"        break;","}"];
    return {lines:L,hit:fim?[4,5,6,7]:[8,9,10],out:[fim?"Fim de semana":"Dia útil"],err:""};
  }
  function range(n){var a=[];for(var i=1;i<=n;i++)a.push(i);return a}
  function cl(v){return Math.min(10,Math.max(1,num(v.n,5)))}
  function cfor(v){var n=cl(v);
    return {lines:["for (int i = 1; i <= "+n+"; i++)","{","    Console.WriteLine(i);","}"],hit:[0,2],out:range(n),err:"",boxes:true};}
  function cwhile(v){var n=cl(v);
    return {lines:["int i = 1;","while (i <= "+n+")","{","    Console.WriteLine(i);","    i++;","}"],hit:[1,3,4],out:range(n),err:"",boxes:true};}
  function cfe(v){var n=cl(v), a=range(n).map(function(x){return x*10});
    return {lines:["int[] numeros = { "+a.join(", ")+" };","","foreach (int x in numeros)","{","    Console.WriteLine(x);","}"],hit:[2,4],out:a,err:"",boxes:true};}

  var CN={l:"Quantas voltas",k:"n",v:"5",t:"number"};
  var TOP=[
   {id:"int",g:0,t:"int – números inteiros",d:"Guarda números inteiros, sem casas decimais (de -2 147 483 648 a 2 147 483 647).",u:"Idades, quantidades, pontuações, contagens.",c:[{l:"Nome",k:"nome",v:"idade"},{l:"Valor",k:"val",v:"17"}],run:vr("int")},
   {id:"double",g:0,t:"double – números decimais",d:"Guarda números com casas decimais. No código escreve-se com ponto (3.5), nunca com vírgula.",u:"Preços, médias, alturas, percentagens.",c:[{l:"Nome",k:"nome",v:"altura"},{l:"Valor",k:"val",v:"1.75"}],run:vr("double")},
   {id:"string",g:0,t:"string – texto",d:"Guarda texto. O valor vai sempre entre aspas duplas.",u:"Nomes, mensagens, moradas, frases.",c:[{l:"Nome",k:"nome",v:"nome"},{l:"Valor",k:"val",v:"Ana"}],run:vr("string")},
   {id:"bool",g:0,t:"bool – verdadeiro ou falso",d:"Só pode ter dois valores: true ou false. É a base de todas as decisões. Atenção: no ecrã o C# escreve True e False com maiúscula.",u:"Respostas sim/não, estados (ligado/desligado).",c:[{l:"Nome",k:"nome",v:"temBilhete"},{l:"Valor",k:"val",v:"true",o:["true","false"]}],run:vr("bool")},
   {id:"char",g:0,t:"char – um carácter",d:"Guarda um único carácter, entre aspas simples.",u:"Letras soltas, iniciais, opções de menu (a, b, c).",c:[{l:"Nome",k:"nome",v:"inicial"},{l:"Valor",k:"val",v:"A"}],run:vr("char")},
   {id:"if / else",g:1,t:"if / else if / else",d:"Testa as condições de cima para baixo e executa só o primeiro bloco cuja condição seja verdadeira. Se nenhuma for, executa o else.",u:"Escolher entre vários caminhos, como classificar uma nota.",c:[{l:"Nota",k:"nota",v:"14",t:"number"}],run:ifelse},
   {id:"&& ||",g:1,t:"Operadores && e ||",d:"&& significa “e” (as duas condições têm de ser verdadeiras). || significa “ou” (basta uma). Permitem juntar condições no mesmo if.",u:"Regras com várias condições, como idade e carta de condução.",c:[{l:"Idade",k:"idade",v:"20",t:"number"},{l:"Tem carta?",k:"carta",v:"true",o:["true","false"]}],run:logic},
   {id:"switch",g:1,t:"switch",d:"Compara uma variável com vários valores (case). O break termina o case e o default trata todos os outros valores.",u:"Quando comparas sempre a mesma variável: dias da semana, opções de menu.",c:[{l:"Dia (1 a 7)",k:"dia",v:"3",o:["1","2","3","4","5","6","7"]}],run:sw},
   {id:"for",g:2,t:"for",d:"Repete um bloco um número conhecido de vezes. Tem três partes: início (int i = 1), condição (i <= n) e passo (i++).",u:"Quando sabes quantas voltas queres, como contar de 1 a 10.",c:[CN],run:cfor},
   {id:"while",g:2,t:"while",d:"Repete enquanto a condição for verdadeira. Tens de atualizar a variável dentro do ciclo (i++), senão o ciclo nunca acaba.",u:"Quando não sabes quantas voltas serão, como pedir uma password até estar certa.",c:[CN],run:cwhile},
   {id:"foreach",g:2,t:"foreach – “para cada”",d:"Uma lista (array) guarda vários valores juntos, como numeros. O foreach pega no primeiro valor, guarda-o em x e executa o bloco. Depois pega no segundo, e assim por diante, até a lista acabar. Não precisas de contador nem de saber quantos elementos há.",u:"Percorrer listas de nomes, notas ou preços, fazendo o mesmo a cada um.",r:"foreach (int x in numeros) lê-se: para cada int x dentro de numeros. Em cada volta, x vale um elemento diferente: primeiro 10, depois 20, depois 30…",c:[{l:"Quantos elementos",k:"n",v:"5",t:"number"}],run:cfe}
  ];
  var GR=[{n:"Variáveis",s:"Onde guardamos informação."},{n:"Decisões",s:"O programa escolhe um caminho consoante uma condição."},{n:"Ciclos",s:"Repetir instruções sem copiar e colar código."}];

  var g=-1, cur=0, timer=null, last=[0,5,8];

  function home(){
    if(timer)clearInterval(timer);
    $("home").innerHTML='<h2>Menu principal</h2><p class="note">Escolhe um tema para começar.</p><div class="mg">'+GR.map(function(x,i){return '<div class="mc"><button class="mt" data-go="'+i+'"><span>'+(i+1)+'</span>'+x.n+'</button><p>'+x.s+'</p>'+TOP.map(function(t,j){return t.g===i?'<button class="chip" data-go="'+i+'" data-t="'+j+'">'+esc(t.id)+'</button>':''}).join('')+'</div>'}).join('')+'</div>';
  }
  $("home").addEventListener("click",function(e){
    var b=e.target.closest("[data-go]");if(!b)return;
    g=parseInt(b.dataset.go,10); cur=b.dataset.t!==undefined?parseInt(b.dataset.t,10):last[g];
    tabs(); topic(cur);
  });

  function tabs(){
    $("tabs").innerHTML='<button data-g="-1"'+(g<0?' class="on"':'')+'>🏠 Menu principal</button>'+GR.map(function(x,i){return '<button data-g="'+i+'"'+(i===g?' class="on"':'')+'>'+(i+1)+'. '+x.n+'</button>'}).join('');
    $("home").style.display=g<0?"block":"none"; $("card").style.display=g<0?"none":"block";
    if(g<0){home();return}
    $("gt").textContent=GR[g].n; $("gs").textContent=GR[g].s;
    $("sub").innerHTML=TOP.map(function(t,i){return t.g===g?'<button data-t="'+i+'"'+(i===cur?' class="on"':'')+'>'+esc(t.id)+'</button>':''}).join('');
  }
  $("tabs").addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    if(g>=0)last[g]=cur;
    g=parseInt(b.dataset.g,10);
    if(g<0){tabs();return}
    cur=last[g]; tabs(); topic(cur);
  });
  $("sub").addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    cur=parseInt(b.dataset.t,10); tabs(); topic(cur);
  });

  function topic(i){
    var t=TOP[i];
    var h='<h3>'+esc(t.t)+'</h3><div class="info"><div><b>O que é</b>'+esc(t.d)+'</div><div><b>Quando usar</b>'+esc(t.u)+'</div>'+(t.r?'<div><b>Como se lê</b>'+esc(t.r)+'</div>':'')+'</div><div class="ctl">';
    t.c.forEach(function(c){
      h+='<label>'+c.l;
      if(c.o) h+='<select data-k="'+c.k+'">'+c.o.map(function(o){return '<option'+(o===c.v?' selected':'')+'>'+o+'</option>'}).join('')+'</select>';
      else h+='<input data-k="'+c.k+'" type="'+(c.t||"text")+'" value="'+esc(c.v)+'">';
      h+='</label>';
    });
    h+='<button class="run" id="rn">▶ Executar</button></div><div class="code" id="code"></div><div class="out" id="con"></div><div class="boxes" id="bx"></div>';
    $("body").innerHTML=h;
    function vals(){var v={};document.querySelectorAll("[data-k]").forEach(function(e){v[e.dataset.k]=e.value});return v}
    function exec(){
      var r=t.run(vals());
      $("code").innerHTML=codeHTML(r.lines,r.hit);
      $("con").innerHTML=""; $("bx").innerHTML="";
      if(timer)clearInterval(timer);
      if(r.err){$("con").innerHTML='<div class="e">'+esc(r.err)+'</div>'; if(!/^Aviso/.test(r.err))return;}
      var k=0;
      function step(){
        if(k>=r.out.length){clearInterval(timer);timer=null;return}
        var d=document.createElement("div");d.className="o";d.textContent=r.out[k];$("con").appendChild(d);
        if(r.boxes){var b=document.createElement("div");b.className="box";b.textContent=r.out[k];$("bx").appendChild(b)}
        k++;
      }
      step();
      if(r.out.length>1)timer=setInterval(step,320);
    }
    document.querySelectorAll("[data-k]").forEach(function(e){e.addEventListener("input",exec)});
    $("rn").addEventListener("click",exec);
    exec();
  }
  tabs();
})();
</script>
</body>
</html>
